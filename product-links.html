<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6F4E37"><title>Product Share Links | EKANNTO</title><link rel="stylesheet" href="assets/css/style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icons/favicon-32.png" type="image/png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-final.png"></head><body data-page="product-links"><header id="header"></header><main class="shell main" id="app"></main><div id="bottom"></div><footer id="footer"></footer><script src="assets/js/icons.js"></script><script src="assets/js/ekannto-ids.js"></script><script src="assets/js/app.js"></script><script src="assets/js/marketplace-plus.js"></script><script src="assets/js/business-features.js"></script><script src="assets/js/ai-features.js"></script><script src="assets/js/delivery-tracking.js"></script><script src="assets/js/layout-v9.js"></script><script src="assets/js/layout-v10.js"></script><script src="assets/js/search-v11.js"></script><script src="assets/js/profile-v12.js"></script><script src="assets/js/v15.js"></script><script src="assets/js/ekannto-ui.js"></script><script src="assets/js/ekannto-enhancements-v34.js"></script><script>
(()=>{const root=document.querySelector('#app');const s=seller();if(!s){location.href='seller-access.html';return}const products=(db.products||[]).filter(p=>String(p.sellerId)===String(s.id)&&!p.deletedAt);root.innerHTML=`<div class="card formwrap"><a href="seller-dashboard.html">← Seller Dashboard</a><h1>Product Share Links</h1><p class="muted">প্রতিটি product-এর আলাদা shareable link এখান থেকে copy করুন।</p><div class="stack">${products.map(p=>{const u=new URL('product.html?id='+encodeURIComponent(p.id),location.href).href;return `<div class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="small muted">${esc(p.id)}</div></div><button class="btn soft" data-copy="${esc(u)}">Copy Link</button></div><input value="${esc(u)}" readonly style="width:100%;margin-top:10px"></div>`}).join('')||'<div class="card empty">No products yet.</div>'}</div></div>`;root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(b.dataset.copy).then(()=>toast('Product link copied')).catch(()=>toast(b.dataset.copy)))})();
</script></body></html>
