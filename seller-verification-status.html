<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6F4E37"><title>Seller Verification Status | EKANNTO</title><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#fbf9f6}.wrap{max-width:700px;margin:30px auto;padding:16px}.panel{background:#fff;border:1px solid #e7ddd4;border-radius:20px;padding:24px}.btn{display:inline-block;background:#6F4E37;color:white;text-decoration:none;padding:12px 16px;border-radius:10px;margin:6px 6px 0 0}.muted{color:#796e65;line-height:1.7}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary div{background:#faf7f3;border-radius:10px;padding:12px;overflow-wrap:anywhere}.summary small{display:block;color:#796e65}@media(max-width:520px){.summary{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel" id="status"><h1>Seller Verification Status</h1><p>Loading…</p></section></main><script src="assets/js/seller-auto-approval-local.js"></script><script>(()=>{const key='ekannto_seller_applications_v14',id=new URLSearchParams(location.search).get('id');let apps=[];try{apps=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const root=document.querySelector('#status'),x=apps.find(z=>z.uuid===id)||apps.slice(-1)[0];if(!x){root.innerHTML='<h1>Application not found</h1><a class="btn" href="seller-onboarding.html">Start again</a>';return}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s=String(x.status||'PENDING_REVIEW').toUpperCase(),approved=s==='APPROVED',rejected=s==='REJECTED';root.innerHTML=`<div style="font-size:64px;text-align:center;color:${approved?'#23734d':rejected?'#b42318':'#6F4E37'}">${approved?'✓':rejected?'✕':'◷'}</div><h1 style="text-align:center">${approved?'Verification Successful':rejected?'Verification Rejected':'Verification Pending'}</h1><p class="muted">${approved?'Admin আপনার আবেদন অনুমোদন করেছেন।':rejected?'আপনার আবেদন reject হয়েছে। কারণ: '+esc(x.reviewReason||'Support-এর সঙ্গে যোগাযোগ করুন।'):'আপনার আবেদন জমা হয়েছে। Admin সিদ্ধান্ত না দেওয়া পর্যন্ত আবেদন Processing অবস্থায় থাকবে। Admin অনুমোদন বা Reject করলে status এখানে দেখা যাবে।'}</p><div class="summary">${[['Application ID',x.uuid],['Seller ID',x.sellerId],['Shop name',x.shop],['Status',s],['Submitted',x.timestamp]].map(([k,v])=>`<div><small>${esc(k)}</small><b>${esc(v||'—')}</b></div>`).join('')}</div><p><b>Reason / Admin note:</b> ${esc(x.reviewReason||'—')}</p>${approved?'<a class="btn" href="seller-access.html">Open Seller Account</a>':''}${rejected?'<a class="btn" href="seller-onboarding.html?retry='+encodeURIComponent(x.uuid)+'">Try Again</a>':''}<a class="btn" href="seller-information.html">Seller Information</a><a class="btn" href="seller-verification-status.html?id=${encodeURIComponent(x.uuid)}">Refresh Status</a><a class="btn" style="background:white;color:#6F4E37;border:1px solid #6F4E37" href="index.html">Back Home</a>`})();</script></body></html>
