<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6F4E37"><title>Seller Registration & Verification | EKANNTO</title><link rel="stylesheet" href="assets/css/style.css"><style>
:root{--coffee:#6F4E37;--light:#F5F0E9;--ink:#29231f;--line:#e7ddd4}body{background:#fbf9f6;color:var(--ink)}.onboard{max-width:760px;margin:22px auto;padding:0 14px 40px}.brandhead{display:flex;align-items:center;gap:12px;margin:14px 0 22px}.brandhead img{width:min(250px,68vw);height:auto;max-height:82px;object-fit:contain;object-position:left center;background:transparent}.brandhead b{letter-spacing:3px;color:var(--coffee)}.cardx{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #6f4e370b}.steps{display:none!important}.step{font-size:11px;text-align:center;padding:9px 3px;border-radius:10px;background:var(--light);color:#77665a;overflow-wrap:anywhere}.step.active{background:var(--coffee);color:#fff}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:650}.field input,.field select{width:100%;min-width:0;box-sizing:border-box;padding:13px 14px;border:1px solid #d9cfc6;border-radius:11px;background:white;font:inherit;color:inherit}.field input:focus,.field select:focus{outline:2px solid #b99a82;outline-offset:1px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btnx{border:1px solid var(--coffee);background:var(--coffee);color:white;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.btnx.alt{background:white;color:var(--coffee)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.mutedx{color:#796e65;line-height:1.65}.notice{background:var(--light);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:14px;line-height:1.65}.terms{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.7;background:#fff}.preview{width:100%;max-height:250px;object-fit:contain;background:var(--light);border:1px dashed #c9b7a8;border-radius:12px;margin-top:8px}.docstage{width:100%;height:clamp(190px,38vw,255px);display:flex;align-items:center;justify-content:center;overflow:hidd /* V54.2: landscape NID frames and a truly circular selfie preview */
