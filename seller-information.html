<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6F4E37"><title>Seller Information | EKANNTO</title><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#fbf9f6}.wrap{max-width:800px;margin:24px auto;padding:14px}.panel{background:#fff;border:1px solid #e7ddd4;border-radius:18px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;background:#faf7f3;border-radius:10px;overflow-wrap:anywhere}.item small{display:block;color:#796e65;margin-bottom:4px}.doc{width:100%;max-height:240px;object-fit:contain;background:#F5F0E9;border-radius:10px}.btn{display:inline-block;background:#6F4E37;color:white;text-decoration:none;padding:11px 15px;border-radius:10px;margin:6px 6px 0 0}.muted{color:#796e65;line-height:1.6}@media(max-width:540px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="btn" href="seller-dashboard.html">← Seller Dashboard</a><section class="panel" id="content"><h1>Seller Information</h1><p>Loading…</p></section></main><script>(()=>{const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const db=read('ekannto_v1',{}),apps=read('ekannto_seller_applications_v14',[]),app=apps.slice().reverse().find(a=>a.userId===db.session),seller=(db.sellers||[]).find(s=>s.id===db.sellerSession)||app,root=document.querySelector('#content');if(!seller){root.innerHTML='<h1>Seller Information</h1><p class="muted">এই session-এর সঙ্গে যুক্ত Seller Information পাওয়া যায়নি।</p><a class="btn" href="seller-access.html">Seller Account</a>';return}const fields=[['Seller ID',seller.sellerId||seller.id],['User ID',seller.userId],['Full name',seller.name],['Shop name',seller.shop],['Email',seller.email],['Phone',seller.phone],['Business category',seller.category],['Payment / withdrawal account',seller.payoutAccount],['NID Number',seller.nidNumber],['NID Name',seller.nidName],['English Name',seller.nidEnglishName],['Father Name',seller.nidFatherName],['Mother Name',seller.nidMotherName],['Date of Birth',seller.nidDob],['Blood Group',seller.nidBloodGroup],['Address',seller.nidAddress],['Verification status',seller.status||'PENDING_REVIEW'],['Application ID',seller.uuid]];root.innerHTML=`<h1>Seller Information</h1><p class="muted">আপনার Seller registration-এ দেওয়া তথ্য। কোনো ভুল থাকলে Support-এর মাধ্যমে Admin-কে সংশোধনের অনুরোধ করুন।</p><div class="grid">${fields.map(([k,v])=>`<div class="item"><small>${esc(k)}</small><b>${esc(v||'—')}</b></div>`).join('')}</div><h2>Identity documents</h2><div class="grid"><div><b>NID Front</b>${seller.nidFront?`<img class="doc" src="${seller.nidFront}" alt="NID front">`:'<p class="muted">No preview available</p>'}</div><div><b>NID Back</b>${seller.nidBack?`<img class="doc" src="${seller.nidBack}" alt="NID back">`:'<p class="muted">No preview available</p>'}</div><div><b>Selfie</b>${seller.liveSelfie?`<img class="doc" src="${seller.liveSelfie}" alt="Selfie">`:'<p class="muted">No preview available</p>'}</div></div><p class="muted">Security note: এই Local Preview-তে পরিচয়পত্র browser storage-এ রাখা হয়; এটি নিরাপদ production storage নয়।</p><a class="btn" href="support.html">Contact Support</a><a class="btn" href="seller-verification-status.html?id=${encodeURIComponent(seller.uuid||'')}">Verification Status</a>`})();</script></body></html>
